langcode: fr
status: true
dependencies:
  module:
    - system
id: contact_us
label: 'Contact US'
code: |-
  /* Style général du formulaire selon la charte graphique du Gouvernorat de Kinshasa */
  .contact-message-feedback-form {
    max-width: 800px;
    margin: 2rem auto;
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    background-color: var(--whiteColor, #ffffff);
    font-family: var(--fontFamily-heading, 'Cooper Hewitt', sans-serif);
    position: relative;
    animation: fadeIn 0.6s ease-out;
  }

  /* Titre du formulaire avec la couleur principale bleu */
  .contact-message-feedback-form::before {
    content: "Contactez le Gouvernorat de Kinshasa";
    display: block;
    font-family: var(--fontFamily-heading, 'Cooper Hewitt', sans-serif);
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 1.5rem;
    color: var(--mainColor, #104293);
    text-align: center;
    border-bottom: 2px solid var(--mainColor, #104293);
    padding-bottom: 1rem;
  }

  /* Bordure décorative avec les couleurs secondaires */
  .contact-message-feedback-form::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(to right, 
      var(--orange, #ED7016) 0%,
      var(--green, #65832E) 25%,
      var(--darkBlue, #17418A) 50%,
      var(--deepTeal, #09242E) 75%,
      var(--accentColor, #DB3832) 100%
    );
    border-radius: 0 0 8px 8px;
  }

  /* Style des champs de formulaire */
  .form-item {
    margin-bottom: 1.5rem;
  }

  /* Style des labels */
  .form-required {
    font-family: var(--fontFamily-heading, 'Cooper Hewitt', sans-serif);
    font-weight: 600;
    color: var(--mainColor, #104293);
    margin-bottom: 0.5rem;
    display: block;
  }

  .form-required:after {
    content: " *";
    color: var(--accentColor, #DB3832);
  }

  /* Style des inputs texte et email */
  .form-text,
  .form-email {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-family: var(--fontFamily-body, 'Poppins', sans-serif);
    transition: border-color 0.3s, box-shadow 0.3s;
    margin-top: 0.25rem;
  }

  .form-text:focus,
  .form-email:focus,
  .form-textarea:focus {
    border-color: var(--secondaryColor, #0095C9);
    box-shadow: 0 0 0 3px rgba(0, 149, 201, 0.25);
    outline: none;
  }

  /* Style du textarea */
  .form-textarea-wrapper {
    width: 100%;
  }

  .form-textarea {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-family: var(--fontFamily-body, 'Poppins', sans-serif);
    min-height: 150px;
    resize: vertical;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  /* Validation visuelle */
  .form-text:invalid,
  .form-email:invalid,
  .form-textarea:invalid {
    border-color: var(--accentColor, #DB3832);
  }

  /* Style des boutons */
  .form-actions {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
  }

  .button {
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 4px;
    font-family: var(--fontFamily-heading, 'Cooper Hewitt', sans-serif);
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
  }

  .button--primary {
    background-color: var(--mainColor, #104293);
    color: var(--whiteColor, #ffffff);
  }

  .button--primary:hover {
    background-color: var(--darkBlue, #17418A);
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(16, 66, 147, 0.3);
  }

  .button:not(.button--primary) {
    background-color: var(--highlightColor, #FFF248);
    color: var(--mainColor, #104293);
  }

  .button:not(.button--primary):hover {
    background-color: var(--highlightColor, #FFF248);
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(255, 242, 75, 0.3);
  }

  /* Animations et effets */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Effet de focus sur tout le formulaire */
  .contact-message-feedback-form:focus-within {
    box-shadow: 0 5px 20px rgba(16, 66, 147, 0.2);
  }

  /* Responsive design */
  @media (max-width: 768px) {
    .contact-message-feedback-form {
      padding: 1.5rem;
      margin: 1rem;
    }
    
    .form-actions {
      flex-direction: column;
    }
    
    .button {
      width: 100%;
    }
  }

  /* Les styles des messages d'etat sont desormais portes par le theme
     (style.css, section « Zone systeme »). Ils y sont uniformes sur tout
     le site et respectent les seuils de contraste : le fond vert plein
     avec texte blanc utilise ici ne tenait que 3,09:1. */

media: all
preprocess: true
conditions:
  request_path:
    id: request_path
    negate: false
    pages: /contact
contexts: {  }
conditions_require_all: true
