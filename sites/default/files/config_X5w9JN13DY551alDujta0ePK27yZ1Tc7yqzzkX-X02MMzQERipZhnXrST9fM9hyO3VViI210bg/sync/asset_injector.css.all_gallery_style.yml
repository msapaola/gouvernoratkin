id: all_gallery_style
label: 'All Gallery Style'
code: |-
  /* Styles de la page-header */
  .page-header {
    background: linear-gradient(to right, var(--mainColor, #104293), var(--secondaryColor, #0095C9));
    color: var(--whiteColor, #ffffff);
    padding: 3rem 0;
    margin-bottom: 2rem;
    position: relative;
  }

  .page-header p {
    color: var(--whiteColor, #ffffff);
    font-family: var(--fontFamily-body, 'Poppins', sans-serif);
  }

  .page-header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 20px;
    background-image: linear-gradient(45deg, #f8f9fa 25%, transparent 25%),
                      linear-gradient(-45deg, #f8f9fa 25%, transparent 25%),
                      linear-gradient(45deg, transparent 75%, #f8f9fa 75%),
                      linear-gradient(-45deg, transparent 75%, #f8f9fa 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  }

  /* Styles pour la carte d'activité */
  .activity-card {
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.3s, box-shadow 0.3s;
    margin-bottom: 2rem;
    position: relative;
    background: var(--whiteColor, #ffffff);
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    height: 100%;
  }

  .activity-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
  }

  /* Conteneur de l'image de la carte */
  .card-img-container {
    position: relative;
    overflow: hidden;
    height: 300px;
  }

  .card-img-top {
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s;
  }

  .activity-card:hover .card-img-top {
    transform: scale(1.05);
  }

  /* Date sur la carte */
  .card-date {
    position: absolute;
    top: 15px;
    right: 15px;
    background-color: rgba(16, 66, 147, 0.8);
    color: var(--whiteColor, #ffffff);
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
    z-index: 1;
    font-family: var(--fontFamily-body, 'Poppins', sans-serif);
  }

  /* Corps de la carte */
  .card-body {
    padding: 1.5rem;
  }

  /* Titre de la carte */
  .card-title {
    font-weight: 600;
    color: var(--mainColor, #104293);
    margin-bottom: 0.5rem;
    font-family: var(--fontFamily-heading, 'Cooper Hewitt', sans-serif);
  } 

  /* Texte de la carte */
  .card-text {
    color: var(--paragraphColor, #555555);
    font-size: 0.9rem;
    font-family: var(--fontFamily-body, 'Poppins', sans-serif);
  }

  /* Footer */
  .footer {
    background-color: var(--mainColor, #104293);
    color: var(--whiteColor, #ffffff);
    padding: 2rem 0;
    margin-top: 3rem;
  }

  /* Styles pour la liste d'images */
  .image-slider {
    position: relative;
    height: 300px;
    overflow: hidden;
  }

  .image-slider ul {
    list-style: none;
    padding: 0;
    margin: 0;
    height: 100%;
  }

  .image-slider li {
    height: 300px;
  }

  .image-slider img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Styles pour les contrôles du slider */
  .slick-prev, .slick-next {
    z-index: 10;
    width: 40px;
    height: 40px;
  }

  .slick-prev {
    left: 10px;
  }

  .slick-next {
    right: 10px;
  }

  .slick-dots {
    bottom: 10px;
  }

  .slick-dots li button:before {
    color: var(--whiteColor, #ffffff);
  }

  /* Media queries */
  @media (max-width: 767.98px) {
    .card-img-container {
      height: 180px;
    }
    
    .image-slider, .image-slider li {
      height: 180px;
    }
  }

  @media (max-width: 575.98px) {
    .card-img-container {
      height: 350px;
    }
    
    .image-slider, .image-slider li {
      height: 350px;
    }
  }
media: all
