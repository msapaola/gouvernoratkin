langcode: fr
status: true
dependencies:
  module:
    - system
id: login_page_style
label: 'Login page Style'
code: |-
  /* Importation des polices */


  /* Style général du formulaire de connexion */
  .user-login-form {
    max-width: 500px;
    margin: 2.5rem auto;
    padding: 2.5rem;
    border-radius: 8px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    background-color: var(--whiteColor, #ffffff);
    font-family: var(--fontFamily-heading, 'Cooper Hewitt', sans-serif);
    position: relative;
  }

  /* Titre du formulaire de connexion */
  .user-login-form::before {
    content: "Connexion";
    display: block;
    font-family: var(--fontFamily-heading, 'Cooper Hewitt', sans-serif);
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 2rem;
    color: var(--mainColor, #104293); /* Couleur principale bleu C:100 M:87 J:8 N:1 */
    text-align: center;
    border-bottom: 2px solid var(--mainColor, #104293);
    padding-bottom: 1rem;
  }

  /* Style des champs de formulaire */
  .form-item {
    margin-bottom: 1.8rem;
    position: relative;
  }

  /* Style des labels */
  .form-required {
    font-family: var(--fontFamily-heading, 'Cooper Hewitt', sans-serif);
    font-weight: 600;
    color: var(--mainColor, #104293); /* Couleur principale bleu */
    margin-bottom: 0.5rem;
    display: block;
    font-size: 1rem;
  }

  /* Indication de champ obligatoire */
  .form-required:after {
    content: " *";
    color: var(--accentColor, #DB3832); /* Rouge secondaire C:8 M:93 J:91 N:1 */
  }

  /* Style des inputs texte et password */
  .form-text {
    width: 100%;
    padding: 0.9rem 1rem;
    border: 2px solid #E5E5E5;
    border-radius: 6px;
    font-family: var(--fontFamily-body, 'Poppins', sans-serif);
    font-size: 1rem;
    transition: all 0.3s ease;
    margin-top: 0.25rem;
    background-color: #F9F9F9;
  }

  .form-text:focus {
    border-color: var(--secondaryColor, #0095C9); /* Couleur cyan C:79 M:27 J:6 N:0 */
    box-shadow: 0 0 0 3px rgba(0, 149, 201, 0.25);
    outline: none;
    background-color: var(--whiteColor, #ffffff);
  }

  /* Icônes pour les champs (simulation) */
  .js-form-item-name::after {
    content: "👤";
    position: absolute;
    right: 12px;
    bottom: 10px;
    font-size: 1.2rem;
    opacity: 0.5;
    pointer-events: none;
  }

  .js-form-item-pass::after {
    content: "🔒";
    position: absolute;
    right: 12px; 
    bottom: 10px;
    font-size: 1.2rem;
    opacity: 0.5;
    pointer-events: none;
  }

  /* Style des boutons */
  .form-actions {
    margin-top: 2.5rem;
  }

  .button {
    width: 100%;
    padding: 0.9rem 1.5rem;
    border: none;
    border-radius: 6px;
    font-family: var(--fontFamily-heading, 'Cooper Hewitt', sans-serif);
    font-weight: 700;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
  }

  .button.js-form-submit {
    background-color: var(--mainColor, #104293); /* Couleur principale bleu */
    color: white;
    letter-spacing: 1px;
    box-shadow: 0 4px 6px rgba(16, 66, 147, 0.2);
  }

  .button.js-form-submit:hover {
    background-color: var(--darkBlue, #17418A); /* Version légèrement plus foncée */
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(16, 66, 147, 0.3);
  }

  .button.js-form-submit:active {
    transform: translateY(1px);
    box-shadow: 0 2px 3px rgba(16, 66, 147, 0.3);
  }

  /* Liens sous le formulaire */
  .user-login-form ~ .item-list {
    max-width: 500px;
    margin: 1rem auto;
    text-align: center;
  }

  .user-login-form ~ .item-list ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .user-login-form ~ .item-list ul li {
    margin: 0.5rem 0;
  }

  .user-login-form ~ .item-list ul li a {
    color: var(--secondaryColor, #0095C9); /* Couleur cyan C:79 M:27 J:6 N:0 */
    text-decoration: none;
    font-family: var(--fontFamily-body, 'Poppins', sans-serif);
    font-size: 0.9rem;
    transition: color 0.3s;
  }

  .user-login-form ~ .item-list ul li a:hover {
    color: var(--mainColor, #104293); /* Couleur principale bleu */
    text-decoration: underline;
  }

  /* Animations et effets */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .user-login-form {
    animation: fadeIn 0.6s ease-out;
  }

  /* Les styles des messages d'etat sont desormais portes par le theme
     (style.css, section « Zone systeme »). Ils y sont uniformes sur tout
     le site et respectent les seuils de contraste : le fond vert plein
     avec texte blanc utilise ici ne tenait que 3,09:1. */

  /* Responsive design */
  @media (max-width: 768px) {
    .user-login-form {
      padding: 2rem 1.5rem;
      margin: 1.5rem 1rem;
    }
  }

  /* Ajout d'une bordure décorative avec les couleurs secondaires */
  .user-login-form::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(to right, 
      var(--orange, #ED7016) 0%, /* Orange C:3 M:69 J:100 N:0 */
      var(--green, #65832E) 25%, /* Vert C:45 M:5 J:100 N:0 */
      var(--darkBlue, #17418A) 50%, /* Bleu foncé C:100 M:86 J:15 N:3 */
      var(--deepTeal, #09242E) 75%, /* Bleu-vert foncé C:90 M:69 J:57 N:66 */
      var(--accentColor, #DB3832) 100% /* Rouge C:8 M:93 J:91 N:1 */
    );
    border-radius: 0 0 8px 8px;
  }

  /* Correction pour le bouton de connexion en français */
  .button.js-form-submit[value="Log in"] {
    content: "Se connecter";
  }

  /* Badge Gouvernorat de Kinshasa */
  .user-login-form::after {
    content: "";
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 80px;
    background-color: var(--mainColor, #104293);
    border-radius: 50%;
    box-shadow: 0 4px 10px rgba(16, 66, 147, 0.3);
    z-index: 0;
  }

  .user-login-form::before {
    margin-top: 15px;
  }
media: all
preprocess: true
