id: cabinet_du_gouverneur
label: 'Cabinet du gouverneur'
code: |-
  /* Présentation section */
  #presentation {
    background: linear-gradient(to right, var(--whiteColor, #ffffff), var(--secondaryColor, #0095C9), var(--whiteColor, #ffffff));
    padding: 60px 0;
  }

  .presentation-content {
    background-color: rgba(255, 255, 255, 0.9);
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
  }

  .director-img-container {
    width: 300px;
    height: 300px;
    background-color: #e9e9e9;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 5px;
    margin: 0 auto 20px;
  }

  .director-img-container img {
    width: 100%;
    height: 300px;
    object-fit: cover;
  }

  /* Membres du cabinet section */
  #membres {
    padding: 60px 0;
    background-color: #f8f9fa;
  }

  .membre-card {
    height: 100%;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease;
    margin-bottom: 20px;
  }

  .membre-card:hover {
    transform: translateY(-5px);
  }

  .card-img-top-container {
    height: 250px;
    background-color: #e9e9e9;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-img-top-container img {
    width: 100%;
    height: 250px;
    object-fit: cover;
  }

  .card-title {
    font-family: var(--fontFamily-heading, 'Cooper Hewitt', sans-serif);
    font-weight: 500;
    color: var(--mainColor, #104293); /* Bleu primaire de la charte */
  }

  .card-subtitle {
    font-family: var(--fontFamily-body, 'Poppins', sans-serif);
    font-weight: 500;
    font-style: italic;
    color: var(--secondaryColor, #0095C9); /* Bleu secondaire de la charte */
  }

  .card-text {
    font-family: var(--fontFamily-body, 'Poppins', sans-serif);
    font-weight: 500;
    color: var(--deepTeal, #09242E); /* Gris foncé de la charte */
  }

   img {
        border-radius: 10px;
    }

  /* Responsive adjustments */
  @media (max-width: 992px) {
    .site-title {
      font-size: 1.5rem;
      font-family: var(--fontFamily-heading, 'Cooper Hewitt', sans-serif);
    }
  }

  @media (max-width: 768px) {
    .site-title {
      font-size: 1.2rem;
      text-align: center;
      font-family: var(--fontFamily-heading, 'Cooper Hewitt', sans-serif);
    }

    .logo-container {
      margin: 0 auto 20px;
    }

    .header-content {
      flex-direction: column;
      text-align: center;
    }
  }
media: all
