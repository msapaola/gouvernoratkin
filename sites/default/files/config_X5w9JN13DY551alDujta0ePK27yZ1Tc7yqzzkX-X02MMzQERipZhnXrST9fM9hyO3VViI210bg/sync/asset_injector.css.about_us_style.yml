id: about_us_style
label: 'About us Page'
code: |-
  /* Styles pour les animations avec Intersection Observer */
  .animate-fade-up {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 800ms ease, transform 800ms ease;
  }

  .animate-fade-up.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Animation zoom-in */
  .animate-zoom-in {
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 800ms ease, transform 800ms ease;
  }

  .animate-zoom-in.visible {
    opacity: 1;
    transform: scale(1);
  }

  /* Autres styles de la page */
  .about-header {
    padding: 100px 0;
    background-color: var(--mainColor, #104293); /* Bleu primaire de la charte */
    color: var(--whiteColor, #ffffff); /* Blanc de la charte */
  }

  .about-title {
    font-weight: 700;
    margin-bottom: 20px;
    font-family: var(--fontFamily-heading, 'Cooper Hewitt', sans-serif); /* Titres */
    color: var(--whiteColor, #ffffff); /* Blanc de la charte */
  }

  .about-subtitle {
    font-size: 1.2rem;
    opacity: 0.9;
    font-family: var(--fontFamily-body, 'Poppins', sans-serif); /* Corps du texte */
    color: var(--whiteColor, #ffffff); /* Blanc de la charte */
  }

  .section {
    padding: 80px 0;
  }

  .section-gray {
    background-color: #f5f5f5;
  }

  .section-title {
    text-align: center;
    margin-bottom: 50px;
    color: var(--mainColor, #104293); /* Bleu primaire de la charte */
    font-weight: 700;
    font-family: var(--fontFamily-heading, 'Cooper Hewitt', sans-serif); /* Titres */
  }

  .intro-text {
    font-size: 1.1rem;
    line-height: 1.8;
    margin-bottom: 40px;
    text-align: center;
    font-family: var(--fontFamily-body, 'Poppins', sans-serif); /* Corps du texte */
    color: var(--paragraphColor, #555555); /* Gris pour paragraphes */
  }

  .highlight {
    font-weight: 700;
    color: var(--mainColor, #104293); /* Bleu primaire de la charte */
    font-family: var(--fontFamily-body, 'Poppins', sans-serif); /* Corps du texte */
  }

  .main-image-container {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
  }

  .image-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0, 0, 0, 0.7);
    color: var(--whiteColor, #ffffff); /* Blanc de la charte */
    padding: 15px;
  }

  .image-caption {
    margin: 0;
    font-style: italic;
    font-family: var(--fontFamily-body, 'Poppins', sans-serif); /* Corps du texte */
    color: var(--whiteColor, #ffffff); /* Blanc de la charte */
  }

  .feature-box {
    background: var(--whiteColor, #ffffff); /* Blanc de la charte */
    border-radius: 10px;
    padding: 30px;
    height: 100%;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
    transition: transform 0.3s;
  }

  .feature-box:hover {
    transform: translateY(-10px);
  }

  .feature-icon {
    font-size: 2.5rem;
    color: var(--mainColor, #104293); /* Bleu primaire de la charte */
    margin-bottom: 20px;
  }

  .feature-title {
    color: var(--mainColor, #104293); /* Bleu primaire de la charte */
    margin-bottom: 15px;
    font-family: var(--fontFamily-heading, 'Cooper Hewitt', sans-serif); /* Titres */
  }

  .timeline {
    position: relative;
    max-width: 1200px;
    margin: 0 auto;
  }

  .timeline::after {
    content: '';
    position: absolute;
    width: 6px;
    background-color: var(--mainColor, #104293); /* Bleu primaire de la charte */
    top: 0;
    bottom: 0;
    left: 50%;
    margin-left: -3px;
  }

  .timeline-container {
    padding: 10px 40px;
    position: relative;
    width: 50%;
    box-sizing: border-box;
  }

  .timeline-container.left {
    left: 0;
  }

  .timeline-container.right {
    left: 50%;
  }

  .timeline-content {
    padding: 20px 30px;
    background-color: var(--whiteColor, #ffffff); /* Blanc de la charte */
    position: relative;
    border-radius: 6px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
  }

  .timeline-date {
    display: inline-block;
    background-color: var(--mainColor, #104293); /* Bleu primaire de la charte */
    color: var(--whiteColor, #ffffff); /* Blanc de la charte */
    padding: 5px 15px;
    border-radius: 20px;
    font-weight: 500;
    margin-bottom: 10px;
    font-family: var(--fontFamily-body, 'Poppins', sans-serif); /* Corps du texte */
  }

  .timeline-title {
    color: var(--mainColor, #104293); /* Bleu primaire de la charte */
    margin-bottom: 10px;
    font-family: var(--fontFamily-heading, 'Cooper Hewitt', sans-serif); /* Titres */
  }

  .cta-section {
    background-color: var(--mainColor, #104293); /* Bleu primaire de la charte */
    color: var(--whiteColor, #ffffff); /* Blanc de la charte */
    padding: 80px 0;
    text-align: center;
  }

  .cta-title {
    font-weight: 700;
    margin-bottom: 20px;
    font-family: var(--fontFamily-heading, 'Cooper Hewitt', sans-serif); /* Titres */
    color: var(--whiteColor, #ffffff); /* Blanc de la charte */
  }

  .cta-text {
    font-size: 1.1rem;
    max-width: 800px;
    margin: 0 auto 30px;
    opacity: 0.9;
    color: var(--whiteColor, #ffffff); /* Blanc de la charte */
    font-family: var(--fontFamily-body, 'Poppins', sans-serif); /* Corps du texte */
  }

  .cta-button {
    background-color: var(--whiteColor, #ffffff); /* Blanc de la charte */
    color: var(--mainColor, #104293); /* Bleu primaire de la charte */
    font-weight: 600;
    padding: 12px 30px;
    border-radius: 30px;
    text-transform: uppercase;
    transition: all 0.3s;
    font-family: var(--fontFamily-body, 'Poppins', sans-serif); /* Corps du texte */
  }

  .cta-button:hover {
    background-color: transparent;
    color: var(--whiteColor, #ffffff); /* Blanc de la charte */
    border: 2px solid var(--whiteColor, #ffffff); /* Blanc de la charte */
    transform: translateY(-3px);
  }

  @media screen and (max-width: 768px) {
    .timeline::after {
      left: 31px;
    }
    
    .timeline-container {
      width: 100%;
      padding-left: 70px;
      padding-right: 25px;
    }
    
    .timeline-container.right {
      left: 0%;
    }
  }
media: all
