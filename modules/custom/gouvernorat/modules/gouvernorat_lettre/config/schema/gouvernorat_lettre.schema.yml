gouvernorat_lettre.settings:
  type: config_object
  label: "Lettre d'information"
  mapping:
    expediteur:
      type: email
      label: 'Adresse expéditrice'
    nom_expediteur:
      type: label
      label: "Nom de l'expéditeur"
    repondre_a:
      type: email
      label: 'Adresse de réponse'
    hote:
      type: string
      label: 'Serveur SMTP'
    port:
      type: integer
      label: 'Port'
    chiffrement:
      type: string
      label: 'Chiffrement'
    utilisateur:
      type: string
      label: 'Identifiant SMTP'
    quota_heure:
      type: integer
      label: 'Courriels par heure au maximum'
    adresse_test:
      type: email
      label: "Adresse pour l'envoi de test"
    presentation:
      type: text
      label: "Présentation sur la page d'inscription"
