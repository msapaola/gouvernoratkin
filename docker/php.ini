; Réglages PHP du site.
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
; L'assistant virtuel peut attendre jusqu'à 20 s la réponse de l'API.
max_execution_time = 90
max_input_vars = 5000
expose_php = Off
date.timezone = Africa/Kinshasa
output_buffering = 4096

; Cache du code compilé. Le code ne change qu'à la reconstruction de l'image :
; inutile de vérifier les fichiers à chaque requête.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0

apc.shm_size = 64M

