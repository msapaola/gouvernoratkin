# Apache écoute sur le port 80 du conteneur, sans port publié : seul Nginx
# Proxy Manager le joint, par le réseau Docker « proxy », et lui transmet
# X-Forwarded-For / -Proto / -Host / -Port.
#
# Apache ne réécrit PAS l'adresse de la connexion (pas de mod_remoteip) :
# Drupal doit voir l'adresse privée du proxy pour accepter ses en-têtes
# X-Forwarded-* (docker/settings.php). Si Apache la remplaçait par celle du
# visiteur, Drupal ignorerait X-Forwarded-Proto : adresses en http:// et
# HTTPS non reconnu.
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        # Les .htaccess du projet s'appliquent (réécriture d'adresses,
        # dossier deploiement/ interdit, protection des fichiers…).
        AllowOverride All
        Require all granted
    </Directory>

    # Journal d'accès : adresse du visiteur (X-Forwarded-For) puis adresse
    # du proxy, sur la sortie standard (docker logs).
    LogFormat "%{X-Forwarded-For}i (via %a) %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" proxy_combined
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 proxy_combined
</VirtualHost>
