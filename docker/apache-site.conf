# Apache n'écoute que sur 127.0.0.1:8080 : seul Caddy, dans le même
# conteneur, lui transmet les visites (et ajoute X-Forwarded-For / -Proto).
<VirtualHost 127.0.0.1:8080>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        # Les .htaccess du projet s'appliquent (réécriture d'adresses,
        # dossier deploiement/ interdit, protection des fichiers…).
        AllowOverride All
        Require all granted
    </Directory>

    # Adresse réelle du visiteur dans les journaux (et non celle de Caddy).
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 127.0.0.1

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
