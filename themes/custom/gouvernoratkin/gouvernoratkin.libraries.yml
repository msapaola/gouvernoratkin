drupal.nav-tabs:
  version: 5.3.3
  js:
    js/nav-tabs.js: {}
  dependencies:
    - core/matchmedia
    - core/drupal
    - core/once
    - core/drupal.debounce
    - core/collapse
    - core/drupal.toolbar
    - core/backbone

# Briques partagees par les pages entierement decrites dans le theme
# (surtitres, boutons, entetes de section). Chargee en dependance, jamais seule.
composants:
  css:
    theme:
        assets/css/composants.css: {}

# Styles propres a la page d'accueil, attachee depuis page--front.html.twig.
# Isolee de global-styling : elle n'est chargee que sur la page qui s'en sert.
accueil:
  css:
    theme:
        assets/css/accueil.css: {}
  dependencies:
    - gouvernoratkin/composants

# Styles propres a la page « A propos », attachee depuis page--a-propos.html.twig.
apropos:
  css:
    theme:
        assets/css/apropos.css: {}
  dependencies:
    - gouvernoratkin/composants

# Styles propres a la page « Executif provincial », attachee depuis
# page--executif-provincial.html.twig. Reprend les classes du contenu saisi
# dans l'editeur, jusqu'ici habillees par une feuille injectee hors du depot.
executif:
  css:
    theme:
        assets/css/executif.css: {}
  dependencies:
    - gouvernoratkin/composants

# Styles propres a la page « Cabinet du gouverneur ».
cabinet:
  css:
    theme:
        assets/css/cabinet.css: {}
  dependencies:
    - gouvernoratkin/composants

# Styles propres a la page « Culture et patrimoine ».
culture:
  css:
    theme:
        assets/css/culture.css: {}
  dependencies:
    - gouvernoratkin/composants

# Styles propres a la page « Structures et services de la ville ».
structures:
  css:
    theme:
        assets/css/structures.css: {}
  dependencies:
    - gouvernoratkin/composants
